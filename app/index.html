<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support dashboard</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 760px; padding: 0 1rem; color: #172033; }
      article { border: 1px solid #ccd3df; border-radius: 8px; margin: 1rem 0; padding: 1rem; }
      button { cursor: pointer; margin-right: .5rem; padding: .55rem .8rem; }
      button:disabled { cursor: not-allowed; }
      [role="status"] { min-height: 1.5rem; }
      .message-id { font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Support dashboard</h1>
      <section aria-labelledby="ticket-heading">
        <h2 id="ticket-heading">Ticket T-100</h2>
        <article>
          <p><span class="message-id">m1</span> My package is delayed and I need an update.</p>
        </article>
        <article>
          <p><span class="message-id">m2</span> I ordered it last week; please check the delivery.</p>
        </article>
      </section>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">AI-assisted summary</h2>
        <p data-testid="summary" aria-live="polite"></p>
        <p data-testid="generation-status" role="status" aria-live="polite"></p>
        <button type="button" data-testid="generate-summary">Generate summary</button>
        <button type="button" data-testid="approve-summary" disabled>Approve summary</button>
      </section>
    </main>
    <script type="module">
      import { evaluateSummary } from './summary-evaluator.js';

      const ticketId = 'T-100';
      const ticketMessages = [
        { id: 'm1', text: 'My package is delayed and I need an update.' },
        { id: 'm2', text: 'I ordered it last week; please check the delivery.' },
      ];
      const generateButton = document.querySelector('[data-testid="generate-summary"]');
      const approveButton = document.querySelector('[data-testid="approve-summary"]');
      const summaryElement = document.querySelector('[data-testid="summary"]');
      const statusElement = document.querySelector('[data-testid="generation-status"]');
      let eligible = false;

      /** Requests a summary from the local service boundary and updates the UI state. */
      async function generateSummary() {
        generateButton.disabled = true;
        approveButton.disabled = true;
        eligible = false;
        statusElement.textContent = 'Generating summary...';
        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticketId, messages: ticketMessages }),
          });
          if (!response.ok) {
            throw new Error(`Summary service returned ${response.status}`);
          }
          const result = await response.json();
          if (result.status === 'insufficient_information') {
            summaryElement.textContent = '';
            statusElement.textContent = 'Insufficient information to generate a summary.';
            generateButton.textContent = 'Generate summary';
            return;
          }
          if (result.status !== 'ok') {
            throw new Error('Summary service returned an unsupported response');
          }
          if (
            typeof result.summary !== 'string' ||
            !Array.isArray(result.sourceIds) ||
            !result.sourceIds.every((sourceId) => typeof sourceId === 'string')
          ) {
            throw new Error('Summary service returned an invalid summary payload');
          }

          summaryElement.textContent = result.summary;
          const evaluation = evaluateSummary(
            { text: result.summary, sourceIds: result.sourceIds },
            ticketMessages,
          );
          eligible = evaluation.eligible;
          if (eligible) {
            statusElement.textContent = 'Summary ready';
            approveButton.disabled = false;
          } else {
            statusElement.textContent = `Summary is not eligible for approval: ${evaluation.reasons.join(' ')}`;
          }
          generateButton.textContent = 'Generate summary';
        } catch (error) {
          statusElement.textContent = 'Generation failed. Please retry.';
          generateButton.textContent = 'Retry generation';
          console.error(error);
        } finally {
          generateButton.disabled = false;
        }
      }

      /** Marks an eligible generated summary as approved. */
      function approveSummary() {
        if (!eligible) {
          return;
        }
        statusElement.textContent = 'Summary approved';
        approveButton.disabled = true;
      }

      generateButton.addEventListener('click', generateSummary);
      approveButton.addEventListener('click', approveSummary);
    </script>
  </body>
</html>
